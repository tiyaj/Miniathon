<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%">
  <defs>
    <radialGradient id="regGlow" cx="45%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00c8b3" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#0e3d54" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#07131a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#04070a"/>
    </radialGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#07131a" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="800" fill="#04070a"/>
  <rect width="1100" height="800" fill="url(#regGlow)"/>

  <!-- Registration counter desks -->
  <polygon points="120,540 980,540 1060,680 40,680" fill="#0a1720"/>
  <rect x="40" y="680" width="1020" height="120" fill="#060c12"/>

  <!-- Laptops & QR Terminals glowing -->
  <rect x="220" y="470" width="90" height="60" rx="3" fill="#142838" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="205,530 325,530 335,540 195,540" fill="#0a1720"/>

  <rect x="500" y="465" width="100" height="65" rx="3" fill="#142838" stroke="#00ffcc" stroke-width="2"/>
  <polygon points="485,530 615,530 625,540 475,540" fill="#0a1720"/>

  <rect x="790" y="470" width="90" height="60" rx="3" fill="#142838" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="775,530 895,530 905,540 765,540" fill="#0a1720"/>

  <!-- Volunteer Staff Silhouettes behind desk -->
  <circle cx="265" cy="410" r="32" fill="#03070a"/>
  <path d="M 215 470 C 215 440 315 440 315 470 Z" fill="#03070a"/>
  <!-- Lanyard / Badge -->
  <path d="M 255 450 L 265 475 L 275 450" stroke="#f5452c" stroke-width="3" fill="none"/>

  <circle cx="550" cy="400" r="34" fill="#03070a"/>
  <path d="M 495 465 C 495 435 605 435 605 465 Z" fill="#03070a"/>
  <path d="M 540 445 L 550 470 L 560 445" stroke="#f5452c" stroke-width="3" fill="none"/>

  <circle cx="835" cy="410" r="32" fill="#03070a"/>
  <path d="M 785 470 C 785 440 885 440 885 470 Z" fill="#03070a"/>
  <path d="M 825 450 L 835 475 L 845 450" stroke="#f5452c" stroke-width="3" fill="none"/>

  <!-- Overhead signage -->
  <rect x="360" y="160" width="380" height="64" rx="4" fill="#09141d" stroke="#00c8b3" stroke-width="1.5"/>
  <text x="550" y="202" fill="#e0f8ff" font-family="monospace" font-size="20" font-weight="bold" letter-spacing="4" text-anchor="middle">
    DESK 01–06 // REGISTRATION
  </text>

  <!-- Foreground Attendees -->
  <circle cx="380" cy="740" r="42" fill="#020406"/>
  <circle cx="680" cy="730" r="45" fill="#020406"/>
</svg>
