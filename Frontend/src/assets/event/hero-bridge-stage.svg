<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <radialGradient id="hb" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ff0077" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#ff6600" stop-opacity="0.75"/>
      <stop offset="65%" stop-color="#330044"/>
      <stop offset="100%" stop-color="#08010d"/>
    </radialGradient>
    <linearGradient id="bridgeBeam1" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#08010d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bridgeBeam2" x1="100%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#ffdd00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#08010d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" fill="#08010d"/>
  <rect width="500" height="350" fill="url(#hb)"/>

  <!-- Crossing stage lasers -->
  <polygon points="120,50 40,350 240,350" fill="url(#bridgeBeam1)" style="mix-blend-mode: screen;" opacity="0.6"/>
  <polygon points="380,50 260,350 460,350" fill="url(#bridgeBeam2)" style="mix-blend-mode: screen;" opacity="0.6"/>

  <!-- DJ Booth & Performer Silhouette -->
  <rect x="180" y="240" width="140" height="70" fill="#050109"/>
  <!-- Silhouette with raised arm -->
  <circle cx="250" cy="190" r="16" fill="#020004"/>
  <path d="M 230 240 C 230 210 270 210 270 240 Z" fill="#020004"/>
  <line x1="260" y1="210" x2="285" y2="160" stroke="#020004" stroke-width="8" stroke-linecap="round"/>

  <!-- Crowd heads in foreground -->
  <path d="M 0 350 Q 150 290 280 310 Q 400 280 500 350 Z" fill="#020004"/>
  <circle cx="100" cy="295" r="20" fill="#020004"/>
  <circle cx="160" cy="310" r="18" fill="#020004"/>
  <circle cx="340" cy="300" r="22" fill="#020004"/>
  <circle cx="410" cy="315" r="17" fill="#020004"/>
</svg>
