<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <radialGradient id="foodGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ff8811" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#a83210" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#140604" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070302"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1200" fill="#070302"/>
  <rect width="800" height="1200" fill="url(#foodGlow)"/>

  <!-- Hanging festoon light strings -->
  <path d="M 0 160 Q 200 240 400 190 Q 600 240 800 170" stroke="#442010" stroke-width="2" fill="none"/>
  <circle cx="120" cy="200" r="10" fill="#ffdd66" filter="drop-shadow(0 0 8px #ffaa00)"/>
  <circle cx="260" cy="225" r="12" fill="#ffbb44" filter="drop-shadow(0 0 10px #ff8800)"/>
  <circle cx="400" cy="190" r="11" fill="#ffdd66" filter="drop-shadow(0 0 8px #ffaa00)"/>
  <circle cx="540" cy="225" r="12" fill="#ffaa33" filter="drop-shadow(0 0 10px #ff8800)"/>
  <circle cx="680" cy="195" r="10" fill="#ffdd66" filter="drop-shadow(0 0 8px #ffaa00)"/>

  <path d="M 0 300 Q 250 380 500 320 Q 650 360 800 310" stroke="#442010" stroke-width="2" fill="none"/>
  <circle cx="180" cy="340" r="11" fill="#ff9922" filter="drop-shadow(0 0 10px #ff6600)"/>
  <circle cx="360" cy="350" r="13" fill="#ffcc44" filter="drop-shadow(0 0 12px #ffaa00)"/>
  <circle cx="580" cy="340" r="11" fill="#ff9922" filter="drop-shadow(0 0 10px #ff6600)"/>

  <!-- Stall awnings -->
  <polygon points="40,580 380,580 340,660 80,660" fill="#1e0c08"/>
  <line x1="80" y1="660" x2="340" y2="660" stroke="#f5452c" stroke-width="6"/>

  <polygon points="420,560 760,560 720,640 460,640" fill="#1e0c08"/>
  <line x1="460" y1="640" x2="720" y2="640" stroke="#ffaa22" stroke-width="6"/>

  <!-- Volunteers managing queues & counters -->
  <circle cx="210" cy="520" r="28" fill="#0c0504"/>
  <path d="M 160 580 C 160 550 260 550 260 580 Z" fill="#0c0504"/>

  <circle cx="590" cy="500" r="28" fill="#0c0504"/>
  <path d="M 540 560 C 540 530 640 530 640 560 Z" fill="#0c0504"/>

  <!-- Crowd moving between food stalls -->
  <path d="M 0 1200 Q 250 880 500 920 Q 650 890 800 1200 Z" fill="#040201"/>
  <circle cx="160" cy="860" r="32" fill="#040201"/>
  <circle cx="300" cy="820" r="38" fill="#040201"/>
  <circle cx="450" cy="850" r="34" fill="#040201"/>
  <circle cx="610" cy="810" r="36" fill="#040201"/>
  <circle cx="720" cy="870" r="30" fill="#040201"/>
</svg>
