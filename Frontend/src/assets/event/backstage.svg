<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%">
  <defs>
    <radialGradient id="backstageGlow" cx="60%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#385070" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#182434" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#090e15" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#040609"/>
    </radialGradient>
  </defs>
  <rect width="1100" height="800" fill="#040609"/>
  <rect width="1100" height="800" fill="url(#backstageGlow)"/>

  <!-- Scaffolding / Truss Rigs -->
  <line x1="80" y1="0" x2="80" y2="800" stroke="#16202c" stroke-width="8"/>
  <line x1="200" y1="0" x2="200" y2="800" stroke="#16202c" stroke-width="8"/>
  <line x1="80" y1="100" x2="200" y2="200" stroke="#101822" stroke-width="4"/>
  <line x1="80" y1="200" x2="200" y2="100" stroke="#101822" stroke-width="4"/>
  <line x1="80" y1="300" x2="200" y2="400" stroke="#101822" stroke-width="4"/>
  <line x1="80" y1="400" x2="200" y2="300" stroke="#101822" stroke-width="4"/>

  <!-- Road Flight Cases -->
  <rect x="280" y="520" width="180" height="150" fill="#0c131c" stroke="#253548" stroke-width="3"/>
  <circle cx="295" cy="535" r="5" fill="#44607e"/>
  <circle cx="445" cy="535" r="5" fill="#44607e"/>
  <circle cx="295" cy="655" r="5" fill="#44607e"/>
  <circle cx="445" cy="655" r="5" fill="#44607e"/>
  <line x1="280" y1="590" x2="460" y2="590" stroke="#253548" stroke-width="2"/>

  <rect x="490" y="470" width="160" height="200" fill="#0c131c" stroke="#253548" stroke-width="3"/>
  <!-- Warning stencil -->
  <rect x="520" y="520" width="100" height="24" fill="#f5452c" opacity="0.85"/>
  <text x="570" y="537" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="2">CREW ONLY</text>

  <!-- Production monitor desk & comms rack -->
  <rect x="720" y="560" width="300" height="180" fill="#0b1017"/>
  <rect x="750" y="480" width="110" height="75" rx="3" fill="#121b26" stroke="#38bdf8" stroke-width="2"/>
  <rect x="880" y="490" width="100" height="65" rx="3" fill="#121b26" stroke="#00ffcc" stroke-width="2"/>

  <!-- Stage Manager / Lead Coordinator Silhouette with Headset & Radio -->
  <circle cx="680" cy="380" r="38" fill="#030508"/>
  <path d="M 610 470 C 610 425 750 425 750 470 Z" fill="#030508"/>
  <!-- Headset band & boom mic -->
  <path d="M 650 380 A 30 30 0 0 1 710 380" stroke="#486581" stroke-width="6" fill="none"/>
  <circle cx="650" cy="385" r="10" fill="#f5452c"/>
  <circle cx="710" cy="385" r="10" fill="#486581"/>
  <path d="M 650 390 Q 660 415 680 410" stroke="#f5452c" stroke-width="4" fill="none"/>

  <!-- Radio walkie talkie antenna & status LED -->
  <line x1="720" y1="440" x2="720" y2="390" stroke="#f5452c" stroke-width="3"/>
  <circle cx="720" cy="390" r="3" fill="#34d399" filter="drop-shadow(0 0 4px #34d399)"/>
</svg>
