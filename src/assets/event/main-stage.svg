<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <radialGradient id="stageGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#801088" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#140620" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050308"/>
    </radialGradient>
    <linearGradient id="laserV" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#050308" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="laserO" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#050308" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1200" fill="#050308"/>
  <rect width="800" height="1200" fill="url(#stageGlow)"/>

  <!-- Overhead lighting rig -->
  <polygon points="100,100 700,100 750,160 50,160" fill="#0d0714"/>
  <circle cx="200" cy="130" r="14" fill="#ffffff" opacity="0.9"/>
  <circle cx="320" cy="130" r="14" fill="#ff55aa" opacity="0.9"/>
  <circle cx="480" cy="130" r="14" fill="#ff9900" opacity="0.9"/>
  <circle cx="600" cy="130" r="14" fill="#00ffff" opacity="0.9"/>

  <!-- Vertical light beams -->
  <polygon points="200,130 50,1200 350,1200" fill="url(#laserV)" style="mix-blend-mode: screen;" opacity="0.45"/>
  <polygon points="600,130 450,1200 750,1200" fill="url(#laserO)" style="mix-blend-mode: screen;" opacity="0.45"/>
  <polygon points="400,100 150,1200 650,1200" fill="#ff0088" style="mix-blend-mode: screen;" opacity="0.25"/>

  <!-- Stage Platform & DJ booth -->
  <rect x="220" y="740" width="360" height="140" fill="#0a0510"/>
  <rect x="340" y="680" width="120" height="60" fill="#150a22"/>
  <!-- DJ Silhouette with headphones -->
  <path d="M 370 680 C 370 640 430 640 430 680 Z" fill="#040206"/>
  <circle cx="400" cy="620" r="22" fill="#040206"/>
  <path d="M 375 615 Q 400 595 425 615" stroke="#ff3366" stroke-width="5" fill="none"/>

  <!-- Cheering crowd hands & silhouettes -->
  <path d="M 0 1200 L 0 980 Q 200 920 400 960 Q 600 900 800 990 L 800 1200 Z" fill="#020104"/>
  <circle cx="120" cy="940" r="28" fill="#020104"/>
  <circle cx="260" cy="910" r="32" fill="#020104"/>
  <circle cx="390" cy="935" r="27" fill="#020104"/>
  <circle cx="530" cy="890" r="34" fill="#020104"/>
  <circle cx="680" cy="925" r="30" fill="#020104"/>
  <!-- Raised hands -->
  <line x1="280" y1="910" x2="260" y2="820" stroke="#020104" stroke-width="12" stroke-linecap="round"/>
  <line x1="560" y1="890" x2="590" y2="800" stroke="#020104" stroke-width="14" stroke-linecap="round"/>
  <line x1="660" y1="920" x2="680" y2="830" stroke="#020104" stroke-width="12" stroke-linecap="round"/>
</svg>
